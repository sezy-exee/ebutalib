<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Stranica nije pronađena | Lokalni Rast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF9F6;
    --ink: #141310;
    --muted: #5F5C55;
    --line: #E6E3DC;
    --accent: #1A7A46;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 24px;
    text-align: center;
  }
  header { margin-top: 20px; }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 18px;
    text-decoration: none;
    color: var(--ink);
  }
  .logo-mark {
    width: 36px;
    height: 36px;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 13px;
    font-weight: 700;
  }
  main {
    max-width: 480px;
    margin: auto 0;
  }
  .code {
    font-family: 'Fraunces', serif;
    font-size: 96px;
    font-weight: 600;
    line-height: 1;
    color: var(--accent);
    margin-bottom: 12px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 500;
    margin-bottom: 12px;
  }
  p {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 28px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--ink);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    padding: 13px 26px;
    border-radius: 999px;
    text-decoration: none;
    transition: background 0.18s;
  }
  .btn:hover { background: #2B2924; }
  footer {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
  }
</style>
</head>
<body>

<header>
  <a href="https://lokalnirast.store/" class="logo">
    <span class="logo-mark">LR</span>LokalniRast
  </a>
</header>

<main>
  <div class="code">404</div>
  <h1>Stranica nije pronađena</h1>
  <p>Link koji ste otvorili ne postoji ili je premješten. Vratite se na početnu stranicu i pogledajte naše NFC & QR stalke za Google recenzije.</p>
  <a href="https://lokalnirast.store/" class="btn">
    ← Nazad na početnu
  </a>
</main>

<footer>
  © 2026 Lokalni Rast. Sva prava zadržana.
</footer>

</body>
</html>
