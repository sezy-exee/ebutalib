<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Narudžba primljena — Lokalni Rast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#faf9f6;color:#141310;font-family:Inter,sans-serif}.card{max-width:620px;padding:56px;background:#fff;border:1px solid #e6e3dc;border-radius:18px;text-align:center}.mark{width:48px;height:48px;margin:0 auto 24px;border-radius:50%;display:grid;place-items:center;background:#eaf5ef;color:#1a7a46;font-size:24px}h1{margin:0;font:500 42px/1.1 Fraunces,serif}p{margin:18px 0 30px;color:#5f5c55;line-height:1.65}a{display:inline-block;padding:12px 22px;border-radius:999px;background:#141310;color:#fff;text-decoration:none;font-weight:600}
  </style>
</head>
<body><main class="card"><div class="mark">✓</div><h1>Narudžba je primljena.</h1><p>Hvala! Javit ćemo vam se uskoro radi potvrde detalja i dostave.</p><a href="/">Nazad na početnu</a></main></body>
